name: reguly
description: Reguly — pelacak kebiasaan belajar mandiri
version: 1.0.1
publish_to: 'none'

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Pin ke 2.10.2 — versi terakhir SEBELUM passkeys ditambahkan.
  # passkeys & ua_client_hints (penyebab v1 error) tidak ada di versi ini.
  supabase_flutter: 2.10.2
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2
  fl_chart: ^0.70.2
  shared_preferences: ^2.3.3
  audioplayers: ^6.7.1
  # Fitur Monitoring & Push Notification (FCM)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  # Dipakai HANYA untuk mendaftarkan custom Android notification channel
  # (channel dengan custom sound) sebelum FCM mulai kirim notifikasi.
  # Bukan untuk menampilkan notifikasi manual — itu tetap ditangani FCM.
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.4
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#5C4DFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
